<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Required prefix and labeled fields</title>
  <desc id="desc">A neutral placeholder showing the fixed output prefix followed by structured prompt fields.</desc>
  <rect width="960" height="540" fill="#f7f8fa"/>
  <text x="60" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#21252b">Fixed Prefix + Fields</text>
  <rect x="70" y="125" width="820" height="335" rx="18" fill="#ffffff" stroke="#d5dbe6" stroke-width="3"/>
  <rect x="70" y="125" width="820" height="12" rx="6" fill="#4f46e5"/>
  <rect x="120" y="190" width="720" height="70" rx="12" fill="#e0f2fe"/>
  <text x="145" y="235" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#21252b">Generate an image with the following prompt -</text>
  <rect x="120" y="315" width="150" height="70" rx="12" fill="#229f5d"/>
  <rect x="305" y="315" width="150" height="70" rx="12" fill="#0ea5e9"/>
  <rect x="490" y="315" width="150" height="70" rx="12" fill="#7c3aed"/>
  <rect x="675" y="315" width="150" height="70" rx="12" fill="#f59e0b"/>
  <text x="145" y="358" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Object</text>
  <text x="333" y="358" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Scene</text>
  <text x="528" y="358" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Vibe</text>
  <text x="704" y="358" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Ratio</text>
