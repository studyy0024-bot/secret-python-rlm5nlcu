<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Before and after prompt comparison</title>
  <desc id="desc">A neutral placeholder showing a raw image idea transformed into structured prompt fields.</desc>
  <rect width="960" height="540" fill="#f7f8fa"/>
  <text x="60" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#21252b">Raw Idea to Structured Prompt</text>
  <rect x="70" y="120" width="380" height="330" rx="18" fill="#ffffff" stroke="#d5dbe6" stroke-width="3"/>
  <rect x="70" y="120" width="380" height="12" rx="6" fill="#dc3545"/>
  <text x="110" y="185" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#21252b">Before</text>
  <text x="110" y="250" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#667085">cat on windowsill</text>
  <text x="110" y="290" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#667085">rainy day</text>
  <path d="M470 285h55" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/>
  <path d="M520 265l30 20-30 20" fill="none" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="560" y="120" width="380" height="330" rx="18" fill="#ffffff" stroke="#d5dbe6" stroke-width="3"/>
  <rect x="560" y="120" width="380" height="12" rx="6" fill="#229f5d"/>
  <text x="600" y="185" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#21252b">After</text>
  <text x="600" y="240" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#4f46e5">Object: calm cat</text>
  <text x="600" y="285" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#4f46e5">Scene: rainy window</text>
  <text x="600" y="330" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#4f46e5">Vibe: cozy candid</text>
  <text x="600" y="375" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#4f46e5">Aspect Ratio: 4:3</text>
</svg>
